# Defaults for every blog post: paper-like reading (spec R4).
google-scholar: true
citation: true
appendix-style: default
reference-location: margin
citation-location: margin
format:
  html:
    body-classes: blog-post
    template-partials:
      - _partials/title-block.html
    toc: true
    toc-depth: 2
    toc-location: right
    toc-title: "Contents"
    page-layout: article
    code-fold: false
    code-overflow: scroll
    code-copy: hover
    code-line-numbers: false
    code-tools: false
    highlight-style: github
    lightbox: true
    fig-cap-location: bottom
    fig-align: center
