<script>
  // Blog posts cite in the margin (citation-location: margin), and Quarto then omits
  // the end-of-post bibliography. Rebuild it from the margin entries, one per key,
  // sorted by the rendered text (author-year style).
  (function () {
    if (!document.body.classList.contains('blog-post')) return;
    const seen = new Map();
    document.querySelectorAll('.column-margin .csl-entry, aside .csl-entry').forEach(function (entry) {
      const key = (entry.id || entry.textContent).replace(/^ref-/, '');
      if (!seen.has(key)) seen.set(key, entry);
    });
    if (!seen.size) return;
    const list = document.createElement('div');
    list.className = 'references csl-bib-body post-references';
    list.setAttribute('role', 'list');
    Array.from(seen.values())
      .sort(function (a, b) { return a.textContent.localeCompare(b.textContent); })
      .forEach(function (entry) {
        const item = entry.cloneNode(true);
        item.removeAttribute('id');
        item.setAttribute('role', 'listitem');
        list.appendChild(item);
      });
    const target = document.getElementById('refs') || document.getElementById('references');
    if (target) {
      target.appendChild(list);
    } else {
      const section = document.createElement('section');
      section.id = 'references';
      section.innerHTML = '<h2>References</h2>';
      section.appendChild(list);
      const main = document.querySelector('main.content');
      const appendix = document.getElementById('quarto-appendix');
      if (appendix) appendix.parentNode.insertBefore(section, appendix); else main.appendChild(section);
    }
  })();
</script>
<script>
  // Scroll reveal for blog cards (styles in site.scss, timing from basicappleguy.com).
  // Only cards that start below the viewport are hidden-then-revealed; if
  // IntersectionObserver is missing or motion is reduced, nothing is hidden.
  (function () {
    if (!('IntersectionObserver' in window)) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const cards = document.querySelectorAll('.post-tile, .quarto-listing-default .quarto-post');
    if (!cards.length) return;
    const io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add('is-loaded'); io.unobserve(e.target); }
      });
    }, { rootMargin: '0px 0px -8% 0px' });
    cards.forEach(function (card) {
      if (card.getBoundingClientRect().top < window.innerHeight) return;
      card.classList.add('reveal');
      io.observe(card);
    });
  })();
</script>
<script>
  (function() {
    const el = document.getElementById('copyright-year');
    if (el) {
      el.textContent = `© ${new Date().getFullYear()}`;
    }
  })();
</script>
<script>
  (function() {
    const bar = document.getElementById('scroll-progress');
    if (!bar) return;
    const update = () => {
      const doc = document.documentElement;
      const body = document.body;
      const scrollTop = doc.scrollTop || body.scrollTop;
      const height = doc.scrollHeight - doc.clientHeight;
      const progress = height > 0 ? (scrollTop / height) * 100 : 0;
      bar.style.width = progress + '%';
    };
    window.addEventListener('scroll', update, { passive: true });
    window.addEventListener('load', update);
  })();
</script>
<script>
  (function() {
    const body = document.body;
    if (!body) return;
    // Blog posts show code in full; readers came for it.
    if (body.classList.contains('blog-post')) return;

    const MIN_LINES = 10;

    const enhanceBlock = (container, codeEl) => {
      if (!container || !codeEl) return;
      if (container.dataset.codeEnhanced === 'true') return;
      if (container.closest('details.code-block-collapsible')) return;

      const text = codeEl.textContent.replace(/\s+$/, '');
      const lines = text ? text.split(/\r?\n/).length : 0;
      if (lines <= MIN_LINES) {
        container.dataset.codeEnhanced = 'true';
        return;
      }

      const parent = container.parentElement;
      if (!parent) return;

      const details = document.createElement('details');
      details.className = 'code-block-collapsible';

      const summary = document.createElement('summary');
      summary.className = 'code-block-summary';

      const summaryText = document.createElement('span');
      summaryText.className = 'code-block-summary-text';
      summaryText.textContent = `Show code (${lines} lines)`;

      const copyBtn = document.createElement('button');
      copyBtn.type = 'button';
      copyBtn.className = 'code-copy-btn';
      copyBtn.textContent = 'Copy';

      summary.appendChild(summaryText);
      summary.appendChild(copyBtn);
      details.appendChild(summary);

      const bodyWrapper = document.createElement('div');
      bodyWrapper.className = 'code-collapse-body';

      parent.insertBefore(details, container);
      bodyWrapper.appendChild(container);
      details.appendChild(bodyWrapper);

      details.addEventListener('toggle', () => {
        if (details.open) {
          summaryText.textContent = `Hide code (${lines} lines)`;
          details.classList.add('open');
        } else {
          summaryText.textContent = `Show code (${lines} lines)`;
          details.classList.remove('open');
        }
      });

      copyBtn.addEventListener('click', (event) => {
        event.stopPropagation();
        if (!navigator.clipboard) {
          copyBtn.textContent = 'Not supported';
          setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1800);
          return;
        }
        navigator.clipboard.writeText(codeEl.textContent).then(() => {
          copyBtn.textContent = 'Copied!';
          copyBtn.classList.add('copied');
          setTimeout(() => {
            copyBtn.textContent = 'Copy';
            copyBtn.classList.remove('copied');
          }, 1800);
        }).catch(() => {
          copyBtn.textContent = 'Retry';
          copyBtn.classList.add('error');
          setTimeout(() => {
            copyBtn.textContent = 'Copy';
            copyBtn.classList.remove('error');
          }, 1800);
        });
      });

      container.dataset.codeEnhanced = 'true';
    };

    const enhanceAll = () => {
      document.querySelectorAll('div.sourceCode').forEach((container) => {
        const codeEl = container.querySelector('code');
        enhanceBlock(container, codeEl);
      });

      document.querySelectorAll('pre').forEach((pre) => {
        if (pre.closest('div.sourceCode')) return;
        const codeEl = pre.querySelector('code') || pre;
        enhanceBlock(pre, codeEl);
      });
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', enhanceAll);
    } else {
      enhanceAll();
    }
  })();
</script>
