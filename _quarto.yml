project:
  type: website
  output-dir: _site
  pre-render:
    - python3 _data/generate_home_sections.py

website:
  title: "Joseph Frimpong"
  description: "Postdoctoral researcher at Argonne National Laboratory studying electronic structure and optical properties of materials"
  site-url: "https://frimpsjoek.github.io"
  repo-url: "https://github.com/frimpsjoek/frimpsjoek.github.io"
  open-graph: true
  twitter-card:
    creator: "@frimpsjoek"
    card-style: summary_large_image
  
  navbar:
    pinned: true
    title: '<span class="brand-first">Joseph</span> <span class="brand-last">Frimpong</span>'
    logo-alt: "Joseph Frimpong"
    # Theme-aware colors handled by CSS custom properties
    search: true
    left:
      - text: "about"
        href: index.qmd
      #- text: "projects"
      #  href: projects.qmd
      - text: "cv"
        href: cv.qmd
      - text: "publications"
        href: publications.qmd
      - text: "blog"
        href: blog/index.qmd
      - text: "more"
        menu:
          - text: "news"
            href: news.qmd
          - text: "teaching"
            href: teaching.qmd
    right:
      - icon: github
        href: https://github.com/frimpsjoek
        aria-label: GitHub
      - icon: twitter-x
        href: https://twitter.com/frimpsjoek
        aria-label: X (Twitter)
      - icon: linkedin
        href: https://linkedin.com/in/josephfrimpong
        aria-label: LinkedIn
      - icon: envelope
        href: mailto:frimpsjoe@anl.gov
        aria-label: Email

  # sidebar removed for blog pages

format:
  html:
    theme:
      - flatly
      - styles/site.scss
    anchor-sections: false
    toc: true
    toc-location: right
    toc-depth: 3
    smooth-scroll: false  # zenscroll clashes with require.js on Jupyter pages; CSS scroll-behavior instead
    page-layout: article
    grid:
      sidebar-width: 0px
      body-width: 720px
      margin-width: 260px
      gutter-width: 1.5rem
    html-math-method: mathjax
    include-in-header: _includes/theme-init.html
    include-after-body: _includes/after-body.html

execute:
  freeze: auto

bibliography: _bibliography/papers.bib
csl: apa.csl
